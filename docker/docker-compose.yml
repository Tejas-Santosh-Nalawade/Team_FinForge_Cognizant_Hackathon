services:
  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
    container_name: finforge-backend
    ports:
      - "8000:8000"
    env_file:
      - ../backend/.env
    environment:
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000,http://localhost:5173,http://127.0.0.1:5173}
    volumes:
      - ../result:/app/result
      - ../finforge_audit.db:/app/finforge_audit.db

  frontend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8000/api/v1}
    container_name: finforge-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
